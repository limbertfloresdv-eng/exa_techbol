
{% extends 'base.html' %}

{% block title %}Formulario de productos | TechBol{% endblock %}

{% block content %}

<div class="mb-4">
    <h2 class="page-title">
        {{ 'Editar producto' if producto else 'Registrar producto' }}
    </h2>
    <p class="text-secondary">Información del producto e inventario.</p>
</div>

<div class="card p-4">
    <form method="POST">

        <div class="mb-3">
            <label class="form-label fw-semibold">Nombre del producto</label>
            <input type="text" name="nombre" class="form-control"
                   value="{{ producto.nombre if producto else '' }}"
                   maxlength="100" required>
        </div>

        <div class="mb-3">
            <label class="form-label fw-semibold">Precio (Bs)</label>
            <input type="number" name="precio" class="form-control"
                   step="0.01" min="0"
                   value="{{ producto.precio if producto else '' }}" required>
        </div>

        <div class="mb-3">
            <label class="form-label fw-semibold">Stock disponible</label>
            <input type="number" name="stock" class="form-control"
                   min="0"
                   value="{{ producto.stock if producto else '' }}" required>
        </div>

        <div class="d-flex gap-2">
            <button type="submit" class="btn btn-success">
                <i class="fas fa-save me-2"></i> Guardar
            </button>

            <a href="{{ url_for('productos.index') }}" class="btn btn-secondary">
                Cancelar
            </a>
        </div>

    </form>
</div>

{% endblock %}
